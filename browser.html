
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Browser</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:25px;background:#07111f;color:white;font-family:Arial}
header{display:flex;justify-content:space-between;align-items:center}
h1{color:#55baff}
main{max-width:900px;margin:65px auto}
.search{display:flex;gap:10px}
input{flex:1;min-width:0;padding:16px;border-radius:12px;border:1px solid #28618a;background:#101f32;color:white;font-size:16px}
button{padding:15px 20px;border:0;border-radius:12px;background:#168bd0;color:white;font-weight:bold;cursor:pointer}
.panel{margin-top:25px;padding:20px;border:1px solid #244766;border-radius:15px;background:#0c1b2d}
iframe{width:100%;height:500px;border:1px solid #244766;border-radius:12px;margin-top:20px;background:white}
a{color:#55baff}
@media(max-width:600px){.search{flex-direction:column}iframe{height:400px}}
</style>
</head>
<body>
<header>
<h1>JARVIS Browser</h1>
<a href="dashboard.html">← Dashboard</a>
</header>
<main>
<h2>Waar wil je naartoe?</h2>
<div class="search">
<input id="address" placeholder="Typ bijvoorbeeld wikipedia.org">
<button onclick="openSite()">Open website</button>
</div>
<div class="panel">
<p id="status">JARVIS Browser staat klaar.</p>
<button onclick="openExternal()">Open in nieuw tabblad ↗</button>
<iframe id="browserFrame" title="Websitevenster"></iframe>
<p><small>Werkt een website niet in het venster? Gebruik dan het nieuwe tabblad.</small></p>
</div>
</main>
<script>
let currentUrl="";
function getUrl(){
let value=document.getElementById("address").value.trim();
if(!value)return "";
try{
let url=new URL(/^https?:\/\//i.test(value)?value:"https://"+value);
if(!["http:","https:"].includes(url.protocol))return "";
return url.href;
}catch{return "";}
}
function openSite(){
currentUrl=getUrl();
if(!currentUrl){
document.getElementById("status").textContent="Vul een geldig webadres in.";
return;
}
document.getElementById("status").textContent="Website wordt geladen...";
document.getElementById("browserFrame").src=currentUrl;
}
function openExternal(){
if(!currentUrl){
currentUrl=getUrl();
}
if(!currentUrl){
document.getElementById("status").textContent="Vul eerst een webadres in.";
return;
}
window.open(currentUrl,"_blank","noopener,noreferrer");
}
document.getElementById("address").addEventListener("keydown",e=>{
if(e.key==="Enter")openSite();
});
</script>
</body>
</html>
