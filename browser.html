
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Browser</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07111f;color:#eaf4ff;
 font-family:Arial,sans-serif;min-height:100vh;padding:25px;
}
header{display:flex;justify-content:space-between;align-items:center}
h1{color:#55baff}
main{max-width:900px;margin:65px auto}
.search{display:flex;gap:10px}
input{
 flex:1;padding:16px;border-radius:12px;
 border:1px solid #28618a;background:#101f32;
 color:white;font-size:16px;min-width:0;
}
button{
 padding:15px 20px;border:0;border-radius:12px;
 background:#168bd0;color:white;font-weight:bold;cursor:pointer;
}
button:hover{background:#36a9ed}
.panel{
 margin-top:25px;padding:20px;border:1px solid #244766;
 border-radius:15px;background:#0c1b2d;
}
iframe{
 width:100%;height:500px;border:1px solid #244766;
 border-radius:12px;margin-top:20px;background:white;
}
small{color:#91a9c1}
a{color:#55baff}
@media(max-width:600px){
 .search{flex-direction:column}
 iframe{height:400px}
}
</style>
</head>
<body>
<header>
 <h1>JARVIS Browser</h1>
 <a href="dashboard.html">← Dashboard</a>
</header>

<main>
 <h2>Waar wil je naartoe?</h2>
 <p><small>Open een website via JARVIS Browser.</small></p>

 <div class="search">
  <input id="address" placeholder="Typ een website, bijvoorbeeld https://wikipedia.org">
  <button onclick="openSite()">Open website</button>
 </div>

 <div class="panel">
  <strong id="status">JARVIS Browser staat klaar.</strong>
  <p><small>Sommige websites blokkeren weergave binnen dit browservenster.</small></p>
  <iframe id="browserFrame" title="JARVIS websitevenster"></iframe>
  <p><a id="externalLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Open website in nieuw tabblad ↗</a></p>
 </div>
</main>

<script>
function openSite(){
 let value=document.getElementById("address").value.trim();
 if(!value)return;

 let url;
 try{
  url=new URL(/^https?:\/\//i.test(value) ? value : "https://"+value);
  if(!["http:","https:"].includes(url.protocol))throw new Error();
 }catch{
  document.getElementById("status").textContent="Ongeldig webadres.";
  return;
 }

 document.getElementById("status").textContent="Website openen: "+url.hostname;
 document.getElementById("browserFrame").src=url.href;

 const link=document.getElementById("externalLink");
 link.href=url.href;
 link.hidden=false;
}
document.getElementById("address").addEventListener("keydown",e=>{
 if(e.key==="Enter")openSite();
});
</script>
</body>
</html>
